<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8F9FD"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#33446D" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7481A8"/></marker><style>.t{font:700 37px 'Microsoft YaHei';fill:#18213B}.st{font:400 18px 'Microsoft YaHei';fill:#69728A}.lane{font:700 21px 'Microsoft YaHei';fill:#33405F}.h{font:700 19px 'Microsoft YaHei';fill:#202A44}.b{font:400 15px 'Microsoft YaHei';fill:#525D76}.sm{font:400 13px 'Microsoft YaHei';fill:#6D768C}.w{fill:#fff}.box{fill:#fff;filter:url(#sh)}.ln{stroke:#7481A8;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke:#A4AEC9;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1800" height="1320" fill="url(#bg)"/><text x="65" y="66" class="t">工作台 · 人—人—AI 协作会话完整流程</text><text x="65" y="102" class="st">邀请使用精简入会简介；进入会话后，右侧面板展示全员共享的结构化动态摘要</text>
<!-- lanes -->
<rect x="45" y="135" width="270" height="1115" rx="22" fill="#E9EDFF"/><rect x="335" y="135" width="450" height="1115" rx="22" fill="#F3F5FB"/><rect x="805" y="135" width="450" height="1115" rx="22" fill="#F3F5FB"/><rect x="1275" y="135" width="480" height="1115" rx="22" fill="#F3F5FB"/>
<text x="75" y="180" class="lane">会话状态</text><text x="365" y="180" class="lane">发起者</text><text x="835" y="180" class="lane">被邀请成员</text><text x="1305" y="180" class="lane">系统与 AI</text>
<!-- state 1 -->
<rect x="70" y="220" width="220" height="116" rx="19" class="box"/><circle cx="102" cy="253" r="18" fill="#5B6EF5"/><text x="96" y="260" class="w" font-size="16">1</text><text x="132" y="258" class="h">单人 AI 工作</text><text x="92" y="296" class="b">直接输入，AI 默认回复</text><text x="92" y="321" class="sm">现有权限机制保持不变</text>
<rect x="365" y="220" width="390" height="116" rx="19" class="box"/><text x="395" y="260" class="h">先与 AI 完成个人工作</text><text x="395" y="296" class="b">形成历史对话、文件、成果和任务上下文</text><text x="395" y="321" class="sm">需要同事评审或共同推进时发起邀请</text>
<path d="M755 278H1318" class="dash"/><rect x="1330" y="220" width="390" height="116" rx="19" fill="#EEF1FF"/><text x="1360" y="260" class="h">AI 默认参与</text><text x="1360" y="296" class="b">用户直接提问，AI 即时响应</text><text x="1360" y="321" class="sm">当前仍是单人 AI 工作方式</text>
<!-- invite -->
<path d="M560 336V375" class="ln"/><rect x="365" y="388" width="390" height="133" rx="19" class="box"/><text x="395" y="428" class="h">① 点击“邀请”并选择成员</text><text x="395" y="463" class="b">首次邀请说明：</text><text x="415" y="490" class="sm">会话将切换为多人协作模式</text><text x="415" y="513" class="sm">普通消息发给成员，AI 默认静默</text>
<path d="M755 454H1318" class="ln"/><rect x="1330" y="388" width="390" height="133" rx="19" class="box"/><text x="1360" y="428" class="h">② AI 生成精简入会简介</text><text x="1360" y="463" class="b">一句话：做什么＋当前协作重点</text><text x="1360" y="490" class="b">建议 50–80 字</text><text x="1360" y="513" class="sm">不展开完成项、待推进和关键结论</text>
<path d="M1330 505C1200 555 930 555 755 505" class="dash"/><rect x="365" y="555" width="390" height="96" rx="19" fill="#5B6EF5" filter="url(#sh)"/><text x="395" y="594" class="h w">③ 确认并发送邀请</text><text x="395" y="626" class="b w">可修改或重新生成；简介只用于邀请通知</text>
<!-- invitation -->
<path d="M755 603H830" class="ln"/><rect x="835" y="555" width="390" height="126" rx="19" class="box"/><text x="865" y="595" class="h">④ 收到协作邀请通知</text><text x="865" y="630" class="b">邀请人＋会话名称＋精简入会简介</text><text x="865" y="657" class="sm">点击“进入会话”</text>
<path d="M1030 681V717" class="ln"/><rect x="835" y="730" width="390" height="100" rx="19" class="box"/><text x="865" y="770" class="h">⑤ 进入会话最新位置</text><text x="865" y="803" class="b">不定位邀请消息 · 默认打开会话摘要</text>
<!-- state 2 -->
<path d="M365 603C250 620 200 675 200 720" class="ln"/><rect x="70" y="730" width="220" height="132" rx="19" fill="#E9FFF3" filter="url(#sh)"/><circle cx="102" cy="763" r="18" fill="#23B26D"/><text x="96" y="770" class="w" font-size="16">2</text><text x="132" y="768" class="h">多人协作模式</text><text x="92" y="808" class="b">普通消息发送给成员</text><text x="92" y="835" class="b">AI 默认保持静默</text><text x="92" y="857" class="sm">原历史、文件、成果保留</text>
<rect x="1330" y="555" width="390" height="126" rx="19" fill="#FFF8E7" filter="url(#sh)"/><text x="1360" y="595" class="h">模式切换提示（全员可见）</text><text x="1360" y="630" class="b">普通消息发给所有参与成员</text><text x="1360" y="657" class="sm">需要 AI 参与时使用 @AI</text>
<!-- structured summary -->
<rect x="365" y="700" width="390" height="162" rx="19" class="box"/><text x="395" y="740" class="h">右侧默认：结构化会话摘要</text><text x="395" y="773" class="b">全员看到同一份动态工作状态</text><rect x="395" y="794" width="150" height="40" rx="10" fill="#EEF1FF"/><text x="418" y="820" class="b">会话摘要（默认）</text><rect x="555" y="794" width="160" height="40" rx="10" fill="#F3F4F8"/><text x="590" y="820" class="b">会话目录</text><text x="395" y="850" class="sm">工作说明 · 进展 · 完成 · 待推进 · 结论 · 时间</text>
<path d="M835 780H760" class="ln"/>
<!-- collaboration -->
<rect x="70" y="900" width="220" height="228" rx="19" class="box"/><circle cx="102" cy="933" r="18" fill="#F0A329"/><text x="96" y="940" class="w" font-size="16">3</text><text x="132" y="938" class="h">协同工作</text><text x="92" y="980" class="b">普通消息</text><text x="215" y="980" class="sm">AI 静默</text><text x="92" y="1016" class="b">@成员</text><text x="215" y="1016" class="sm">提醒成员</text><text x="92" y="1052" class="b">@AI</text><text x="215" y="1052" class="sm">AI 参与</text><text x="92" y="1090" class="sm">所有内容在公共会话流共享</text>
<rect x="365" y="900" width="390" height="228" rx="19" class="box"/><text x="395" y="940" class="h">轻量回复关联</text><text x="395" y="977" class="b">回复成员：引用作者和原消息</text><text x="395" y="1011" class="b">让 AI 处理：引用消息并插入 @AI</text><text x="395" y="1045" class="sm">本期仅单层引用，不做完整讨论线程</text><rect x="395" y="1070" width="320" height="34" rx="10" fill="#F2F4F8"/><text x="415" y="1093" class="sm">回复　｜　复制　｜　@AI处理</text>
<rect x="835" y="900" width="390" height="228" rx="19" class="box"/><text x="865" y="940" class="h">成员发送 @AI 问题</text><text x="865" y="977" class="b">问题消息对所有参与成员可见</text><text x="865" y="1011" class="b">支持基于某条消息继续提问</text><text x="865" y="1045" class="sm">多人同时调用时，各请求独立关联</text><rect x="865" y="1070" width="320" height="34" rx="10" fill="#EEF1FF"/><text x="885" y="1093" class="sm">@AI 请总结一下刚才的讨论</text>
<path d="M290 1014H360" class="ln"/><path d="M755 1014H830" class="ln"/>
<rect x="1330" y="900" width="390" height="228" rx="19" fill="#EAF8EF" filter="url(#sh)"/><text x="1360" y="940" class="h">AI 回复：先引用问题，再回答</text><rect x="1360" y="965" width="330" height="68" rx="12" fill="#DDE8E0"/><text x="1380" y="989" class="sm">回应 宋贤群</text><text x="1380" y="1018" class="b">@AI 请总结一下刚才的讨论</text><text x="1360" y="1070" class="b">根据当前讨论，团队已经形成……</text><text x="1360" y="1100" class="sm">点击引用区域可定位到原始问题</text><path d="M1225 1014H1325" class="ln"/>
<!-- update -->
<rect x="365" y="1170" width="1355" height="78" rx="20" fill="#202A44"/><text x="395" y="1201" class="h w">动态更新结构化会话摘要</text><text x="395" y="1231" class="b w">点击“更新摘要” → 比对新增消息 → 无变化提示已是最新 → 有有效变化直接更新全员共享摘要，无需预览、编辑或确认</text><path d="M560 1128V1165" class="ln"/><path d="M1030 1128V1165" class="ln"/><path d="M1525 1128V1165" class="ln"/>
