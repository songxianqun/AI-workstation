<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#F8F9FD"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#33446D" flood-opacity=".15"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7783A8"/></marker><style>.t{font:700 35px 'Microsoft YaHei';fill:#18213B}.st{font:400 18px 'Microsoft YaHei';fill:#69728A}.h{font:700 20px 'Microsoft YaHei';fill:#202A44}.b{font:400 16px 'Microsoft YaHei';fill:#525D76}.sm{font:400 14px 'Microsoft YaHei';fill:#69728A}.w{fill:#fff}.box{fill:#fff;filter:url(#s)}.ln{stroke:#7783A8;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="1040" fill="url(#g)"/><text x="60" y="62" class="t">人—人—AI 协作会话完整流程</text><text x="60" y="98" class="st">邀请简介保持精简；进入会话后，右侧面板承载独立的结构化动态摘要</text>
<rect x="60" y="145" width="270" height="115" rx="20" class="box"/><text x="88" y="185" class="h">① 单人 AI 工作</text><text x="88" y="220" class="b">直接输入，AI 默认回复</text><text x="88" y="246" class="sm">现有权限机制保持不变</text><path d="M330 202H390" class="ln"/>
<rect x="395" y="145" width="305" height="115" rx="20" class="box"/><text x="423" y="185" class="h">② 发起者邀请成员</text><text x="423" y="220" class="b">选择一名或多名成员</text><text x="423" y="246" class="sm">首次提示将切换为协作模式</text><path d="M700 202H760" class="ln"/>
<rect x="765" y="145" width="375" height="115" rx="20" fill="#EEF1FF" filter="url(#s)"/><text x="793" y="185" class="h">③ AI 生成精简入会简介</text><text x="793" y="220" class="b">一句话：做什么＋当前协作重点</text><text x="793" y="246" class="sm">50–80字，可修改或重新生成</text><path d="M1140 202H1200" class="ln"/>
<rect x="1205" y="145" width="335" height="115" rx="20" fill="#5B6EF5" filter="url(#s)"/><text x="1233" y="185" class="h w">④ 发送邀请</text><text x="1233" y="220" class="b w">简介只用于通知</text><text x="1233" y="246" class="sm w">不替代右侧结构化摘要</text>
<rect x="60" y="310" width="700" height="155" rx="22" fill="#FFF9E8" filter="url(#s)"/><text x="90" y="350" class="h">邀请通知 · 精简入会简介</text><text x="90" y="385" class="b">让成员快速知道“这是什么会话、现在要协作什么”</text><rect x="90" y="405" width="640" height="38" rx="10" fill="#fff"/><text x="108" y="431" class="sm">推进630版本改造；当前需要共同确认Rclaw接入方案和演示范围。</text>
<rect x="840" y="310" width="700" height="155" rx="22" fill="#ECF8F1" filter="url(#s)"/><text x="870" y="350" class="h">右侧面板 · 结构化会话摘要</text><text x="870" y="385" class="b">全员共享的动态工作状态</text><text x="870" y="420" class="b">工作说明 · 当前进展 · 已完成 · 待推进</text><text x="870" y="448" class="b">关键结论及提出人 · 摘要更新时间</text>
<path d="M1372 260V300" class="ln"/><path d="M1372 465V500" class="ln"/><rect x="1100" y="510" width="440" height="110" rx="20" class="box"/><text x="1128" y="550" class="h">⑤ 成员收到通知并进入</text><text x="1128" y="584" class="b">邀请人＋会话名称＋精简入会简介</text><text x="1128" y="608" class="sm">进入最新消息位置，不定位邀请消息</text><path d="M1100 565H1035" class="ln"/>
<rect x="600" y="510" width="425" height="110" rx="20" fill="#EEF1FF" filter="url(#s)"/><text x="628" y="550" class="h">⑥ 切换为多人协作模式</text><text x="628" y="584" class="b">普通消息发给成员，AI 默认静默</text><text x="628" y="608" class="sm">需要 AI 参与时使用 @AI</text><path d="M600 565H535" class="ln"/>
<rect x="60" y="510" width="465" height="110" rx="20" class="box"/><text x="88" y="550" class="h">⑦ 默认打开结构化会话摘要</text><text x="88" y="584" class="b">所有成员看到相同的动态摘要</text><text x="88" y="608" class="sm">可切换到原有“会话目录”Tab</text>
<path d="M290 620V665" class="ln"/><rect x="60" y="675" width="450" height="190" rx="22" class="box"/><text x="88" y="715" class="h">成员沟通</text><text x="88" y="753" class="b">普通消息 → 全员可见 → AI静默</text><text x="88" y="787" class="b">@成员 → 通知对应成员 → AI静默</text><text x="88" y="821" class="sm">输入框提示需要AI时使用 @AI</text><path d="M510 770H570" class="ln"/>
<rect x="575" y="675" width="450" height="190" rx="22" class="box"/><text x="603" y="715" class="h">轻量回复关联</text><text x="603" y="753" class="b">回复：引用作者和原消息</text><text x="603" y="787" class="b">@AI处理：引用消息并插入 @AI</text><text x="603" y="821" class="sm">本期仅单层引用，不做完整讨论线程</text><path d="M1025 770H1085" class="ln"/>
<rect x="1090" y="675" width="450" height="190" rx="22" fill="#EAF8EF" filter="url(#s)"/><text x="1118" y="715" class="h">@AI：先引用问题，再回答</text><rect x="1118" y="738" width="394" height="62" rx="12" fill="#DDE8E0"/><text x="1138" y="762" class="sm">回应 宋贤群</text><text x="1138" y="788" class="b">@AI 请总结刚才的讨论</text><text x="1118" y="833" class="b">根据当前讨论，团队已经形成……</text>
<rect x="60" y="905" width="1480" height="95" rx="22" fill="#202A44"/><text x="88" y="942" class="h w">动态更新结构化会话摘要</text><text x="88" y="975" class="b w">点击“更新摘要” → 比对新增消息 → 无变化提示已是最新 → 有有效变化直接更新全员共享摘要，无需预览、编辑或确认</text>
</svg>
